name: AnyPS5 progress watcher

on:
  schedule:
    # Une fois par heure, à la minute 17 (UTC).
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anyps5-progress-watcher
  cancel-in-progress: false

jobs:
  check-progress:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier les statistiques et notifier Discord si besoin
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python monitor.py

      - name: Enregistrer le nouvel état
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/stats.json
          if ! git diff --cached --quiet; then
            git commit -m "Update AnyPS5 progress baseline"
            git push
          fi
