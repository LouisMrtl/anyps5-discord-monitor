name: AnyPS5 progress watcher

on:
  schedule:
    # 2 tentatives par heure, hors des minutes surchargées (:00, :30)
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anyps5-progress-watcher
  cancel-in-progress: false

jobs:
  check-progress:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Vérifier les statistiques et notifier Discord si besoin
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          for i in 1 2 3; do
            python monitor.py && exit 0
            echo "Essai $i échoué, nouvelle tentative dans 20 s..."
            sleep 20
          done
          exit 1

      - name: Enregistrer le nouvel état
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/stats.json
          if ! git diff --cached --quiet; then
            git commit -m "Update AnyPS5 progress baseline"
            git pull --rebase origin main
            git push
          fi
